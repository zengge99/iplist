name: Update IP List

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 执行

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests urllib3

    - name: Extract and save IP list
      # 原 vless 来源：源不稳定时可能失败，加 continue-on-error 避免阻塞新来源追加
      continue-on-error: true
      run: |
        cat << 'EOF' > extract_ips.py
        import requests
        import base64
        import re
        from urllib.parse import unquote

        def main():
            encoded_url = "aHR0cHM6Ly9hdXRvLjg1ODY2Ni54eXovYXV0bw=="
            url = base64.b64decode(encoded_url).decode('utf-8')
            print(f"Fetching config from {url}...")
            response = requests.get(url, timeout=20)
            response.raise_for_status()
            
            try:
                decoded = base64.b64decode(response.text).decode('utf-8')
            except Exception as e:
                print(f"Base64 decode failed: {e}")
                exit(1)
            
            pattern = r'vless://[^@]*@([^:/]+)[:/]*(\d+)[^#]*#([^\s]+)'
            matches = re.findall(pattern, decoded)
            
            if not matches:
                print("Error: No server configs found")
                exit(1)
                
            with open("iplist.txt", "w") as f:
                for host, port, remark in matches:
                    remark = unquote(remark)
                    f.write(f"{host}:{port}#{remark}\n")
            
            print(f"Successfully extracted {len(matches)} servers")

        if __name__ == "__main__":
            main()
        EOF

        python extract_ips.py
        
        # 原始文件中注释掉的代码予以保留
        # data="$(curl https://bestip.1996999.xyz/https://wvsvlees.sosorg.nyc.mn/SOSO | grep -oP '^[^#]*#[^🌐🐲]*' | sed 's/[[:space:]]*$//')"
        # if [ "$data"x != x ]; then
        #    echo "$data" > iplist.txt
        # fi

    - name: Append HK/JP/KR IPs from zip.cm.edu.kg
      # runner 网络可能反爬导致下载 403，加容错避免阻塞原来源提交
      continue-on-error: true
      run: |
        # 从 zip.cm.edu.kg 下载 IP 列表，提取 443 端口 HK/JP/KR 地址，
        # 100 线程 curl 指定 IP 访问 www.cloudflare.com 验证联通性，
        # 联通的以 ip:443#地区 格式追加到 iplist.txt（保留原有来源）
        python zipip_append.py

    - name: Pin 优选中转 as first entry
      # 固定条目置顶。必须放在两个生成步骤之后：
      # 上面的 extract 是 open(...,"w") 整体覆盖，zipip_append.py 也会重写文件，
      # 提前写入会被抹掉。这里做去重 + 置顶，幂等。
      run: |
        python - <<'PY'
        PIN = "third-cf.zngle.de5.net:443#优选中转"
        try:
            with open("iplist.txt") as f:
                lines = f.read().splitlines()
        except FileNotFoundError:
            lines = []
        keep = [ln.strip() for ln in lines if ln.strip() and ln.strip() != PIN]
        with open("iplist.txt", "w") as f:
            f.write(PIN + "\n")
            for ln in keep:
                f.write(ln + "\n")
        print(f"[pin] 置顶 {PIN} | 保留其余 {len(keep)} 条")
        PY

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add iplist.txt
        if ! git diff-index --quiet HEAD --; then
          git commit -m "Auto-update IP list [skip ci]"
          git pull --rebase origin main # 拉取最新代码防止冲突
          git push origin HEAD:main
          echo "Changes pushed successfully"
        else
          echo "No changes to commit"
        fi